apiVersion: v1
kind: Secret
metadata:
  name: mcp-core-secrets
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: secrets
type: Opaque
data:
  # Base64 encoded secrets - REPLACE WITH YOUR ACTUAL SECRETS
  # PostgreSQL password (echo -n "your_password" | base64)
  postgres_password: cGFzc3dvcmQxMjM=
  # Vector DB password
  vector_postgres_password: cGFzc3dvcmQxMjM=
  # Redis password
  redis_password: cmVkaXNwYXNzd29yZA==
  # JWT secret
  jwt_secret: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
