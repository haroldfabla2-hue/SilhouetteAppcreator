apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: mcp-core-superior
  labels:
    type: local
    app: postgres
spec:
  storageClassName: standard
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/data/postgres"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: mcp-core-superior
  labels:
    app: postgres
    component: storage
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      type: local
      app: postgres
---
