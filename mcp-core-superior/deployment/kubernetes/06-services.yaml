apiVersion: v1
kind: Service
metadata:
  name: mcp-core-service
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: application
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: mcp
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: mcp-core
    component: application
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-core-headless
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: application
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: mcp
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: mcp-core
    component: application
---
