apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: mcp-core-superior
  labels:
    app: nginx
    component: load-balancer
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: nginx
    component: load-balancer