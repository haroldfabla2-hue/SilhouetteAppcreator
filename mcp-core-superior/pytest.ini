[tool:pytest]
# Configuración de pytest para MCP Core Superior
# Target: 90%+ code coverage

# Directorios de test
testpaths = tests

# Marcadores personalizados
markers =
    unit: Tests unitarios (rápidos, sin dependencias externas)
    integration: Tests de integración (requieren servicios externos)
    agent: Tests específicos de agentes MCP
    security: Tests del sistema de seguridad
    observability: Tests del sistema de observabilidad  
    technical: Tests de diferenciadores técnicos
    core: Tests del sistema core
    async_test: Tests asíncronos
    slow: Tests que tardan más de 5 segundos

# Configuración de output
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=90
    --junitxml=test-results.xml
    --asyncio-mode=auto

# Configuración de asyncio
asyncio_mode = auto

# Configuración de timeout
timeout = 300

# Configuración de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio.*

# Configuración de logging para tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configuración de cobertura
[coverage:run]
source = src/
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*
    */site-packages/*
    */migrations/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
title = MCP Core Superior - Coverage Report

[coverage:xml]
output = coverage.xml