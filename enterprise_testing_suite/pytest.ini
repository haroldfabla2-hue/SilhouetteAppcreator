# Configuración de Pytest para Suite de Testing Enterprise

[pytest]
# Directorios de tests
testpaths = unit_tests integration_tests performance_tests security_tests compliance_tests

# Patrón de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    security: Security tests
    compliance: Compliance tests
    load: Load tests
    slow: Slow running tests
    async: Async tests
    critical: Critical tests
    health: Health check tests

# Configuración de output
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --cov=src
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage.xml
    --cov-fail-under=80
    --junit-xml=reports/junit_report.xml
    --html=reports/html_report.html
    --self-contained-html

# Asyncio
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Configuración de cobertura
[coverage:run]
source = src/,backend/,mcp-core-superior/
omit = 
    */tests/*
    */test_*
    */conftest.py
    */setup.py
    venv/*
    .tox/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    raise AssertionError
    raise NotImplementedError

ignore_errors = true

[coverage:html]
directory = reports/coverage_html
