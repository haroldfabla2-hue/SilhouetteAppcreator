
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'silhouettemcp-ultra'
    static_configs:
      - targets: ['localhost:8001', 'localhost:8002', 'localhost:8003']
    scrape_interval: 5s
    metrics_path: /metrics
    
  - job_name: 'nginx-proxy'
    static_configs:
      - targets: ['localhost:9113']
      
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
