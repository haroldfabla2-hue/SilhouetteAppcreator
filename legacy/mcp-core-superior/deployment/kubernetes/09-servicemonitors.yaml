apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-core-pod-metrics
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: pod-monitoring
spec:
  selector:
    matchLabels:
      app: mcp-core
      component: application
  podMetricsEndpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 5s
    honorLabels: true
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 5s
    honorLabels: true
  namespaceSelector:
    matchNames:
    - mcp-core-superior