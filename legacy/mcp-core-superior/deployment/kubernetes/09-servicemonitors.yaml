apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mcp-core-metrics
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: monitoring
spec:
  selector:
    matchLabels:
      app: mcp-core
      component: application
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
  namespaceSelector:
    matchNames:
    - mcp-core-superior
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
