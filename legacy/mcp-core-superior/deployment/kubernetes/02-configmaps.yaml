apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-core-config
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: config
data:
  # Configuración principal de la aplicación
  MCP_CORE_CONFIG: |
    # MCP Core Superior - Configuración de Producción
    environment: production
    debug: false
    app_name: "MCP Core Superior"
    app_version: "1.0.0"
    
    # Configuración de red
    host: "0.0.0.0"
    port: 8080
    mcp_port: 8081
    metrics_port: 9090
    
    # ContextForge Gateway
    contextforge_url: "http://contextforge:8001"
    contextforge_timeout: 30
    
    # Configuración de streaming
    streaming_enabled: true
    streaming_frequency: 1.0
    streaming_max_duration: 3600
    streaming_buffer_size: 2000
    
    # Rate limiting
    rate_limit_enabled: true
    rate_limit_requests: 100
    rate_limit_window: 60
    
    # Performance tuning
    max_concurrent_tasks: 50
    max_concurrent_tools: 10
    default_timeout_seconds: 300
    agent_timeout_seconds: 300
    agent_retry_attempts: 3
    agent_retry_delay: 2.0
    
    # Memory management
    memory_cache_size: 2000
    memory_cleanup_interval: 3600
    memory_max_age_hours: 24
    
    # Executor configuration
    executor_max_workers: 8
    executor_memory_limit_mb: 512
    executor_cpu_limit: 2.0
    
    # Verification
    verification_quality_threshold: 0.9
    verification_strict_mode: true
    
    # Health checks
    health_check_interval: 15
    health_check_timeout: 10
    
    # Monitoring
    metrics_enabled: true
    tracing_enabled: true
    
    # Logging
    log_level: WARNING
    log_format: json
    
    # Feature flags
    auto_healing_enabled: true
    intelligent_router_enabled: true
    parallel_execution_enabled: true
    collaboration_engine_enabled: true
    context_persistence_enabled: true
    file_processing_enabled: true
    web_scraping_enabled: true
    git_operations_enabled: true
    database_operations_enabled: true
    
    # Security
    cors_enabled: true
    cors_origins: ["https://mcp-core-superior.com"]
    cors_methods: ["GET", "POST", "PUT", "DELETE"]
    cors_headers: ["Content-Type", "Authorization"]
    
    # Development flags (disabled in production)
    skip_migrations: false
    hot_reload: false
    expose_all_endpoints: false
    enable_debug_endpoints: false
    load_testing_mode: false
    
  # Configuración específica para Prometheus
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'mcp-core-superior'
        replica: 'replica-1'
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    scrape_configs:
      # MCP Core metrics
      - job_name: 'mcp-core'
        static_configs:
          - targets: ['mcp-core-service:9090']
        scrape_interval: 10s
        metrics_path: /metrics
        scrape_timeout: 5s
        
      # PostgreSQL metrics (via postgres_exporter)
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
        scrape_interval: 30s
        metrics_path: /metrics
        scrape_timeout: 10s
        
      # Redis metrics (via redis_exporter)
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        scrape_interval: 30s
        metrics_path: /metrics
        scrape_timeout: 10s
        
      # Vector DB metrics
      - job_name: 'vector-postgres'
        static_configs:
          - targets: ['vector-postgres-exporter:9187']
        scrape_interval: 30s
        metrics_path: /metrics
        scrape_timeout: 10s
        
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        scrape_interval: 30s
        
      # Jaeger metrics
      - job_name: 'jaeger'
        static_configs:
          - targets: ['jaeger:14269']
        scrape_interval: 30s
        metrics_path: /metrics
        
      # Node exporter (if available)
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
        scrape_interval: 30s
        
      # Kubelet metrics
      - job_name: 'kubelet'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
        scrape_interval: 30s
        
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
        scrape_interval: 30s

  # Configuración de AlertManager
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@mcp-core-superior.com'
      smtp_auth_username: 'alerts@mcp-core-superior.com'
      smtp_auth_password: 'password'
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
      - match:
          severity: warning
        receiver: 'warning-alerts'
    
    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://alertmanager-webhook:5000/'
        send_resolved: true
    - name: 'critical-alerts'
      email_configs:
      - to: 'ops-team@mcp-core-superior.com'
        subject: 'CRITICAL: MCP Core Superior Alert'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          {{ end }}
    - name: 'warning-alerts'
      email_configs:
      - to: 'dev-team@mcp-core-superior.com'
        subject: 'WARNING: MCP Core Superior Alert'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          {{ end }}
    
    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']