apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-core
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: mcp-core-superior
  name: mcp-core-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-core-rolebinding
  namespace: mcp-core-superior
subjects:
- kind: ServiceAccount
  name: mcp-core
  namespace: mcp-core-superior
roleRef:
  kind: Role
  name: mcp-core-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-core-hpa
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-core
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 3
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: VerticalPodAutoscaler
metadata:
  name: mcp-core-vpa
  namespace: mcp-core-superior
  labels:
    app: mcp-core
    component: autoscaler
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-core
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: mcp-core
      maxAllowed:
        cpu: "4"
        memory: "4Gi"
      minAllowed:
        cpu: "250m"
        memory: "256Mi"