name: Code Quality & Security

on:
  push:
    branches: [ main, develop, staging ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/02-code-quality.yml'
      - 'pyproject.toml'
      - 'setup.cfg'
      - '.flake8'
      - 'mypy.ini'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'

env:
  PYTHON_VERSION: '3.11'

jobs:
  linting:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pylint bandit
        pip install -r file_processing_requirements.txt
        pip install -e .

    - name: Run flake8
      run: |
        flake8 src/ tests/ \
          --max-line-length=88 \
          --extend-ignore=E203,W503,E501 \
          --exclude=__pycache__,migrations,.git,venv,env \
          --format=json --output-file=flake8-report.json || true
        flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503,E501 || true

    - name: Run Black (code formatting)
      run: |
        black --check --diff src/ tests/ || true
        black --line-length 88 src/ tests/ || true

    - name: Run isort (import sorting)
      run: |
        isort --check-only --diff src/ tests/ || true
        isort --line-length 88 src/ tests/ || true

    - name: Run Pylint
      run: |
        pylint src/ --output-format=json > pylint-report.json || true
        pylint src/ --score=yes || true

    - name: Archive linting reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: linting-reports
        path: |
          flake8-report.json
          pylint-report.json
        retention-days: 30

  type-checking:
    name: Type Checking
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-requests types-redis
        pip install -r file_processing_requirements.txt
        pip install -e .

    - name: Run MyPy
      run: |
        mypy src/ \
          --ignore-missing-imports \
          --show-error-codes \
          --pretty \
          --html-report mypy-report

    - name: Archive MyPy report
      uses: actions/upload-artifact@v3
      with:
        name: mypy-report
        path: mypy-report/
        retention-days: 30

  security-scan:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit[toml] semgrep
        pip install -r file_processing_requirements.txt
        pip install -e .

    - name: Run Safety (dependency vulnerabilities)
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Run Bandit (static security analysis)
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -ll || true

    - name: Run Semgrep (SAST)
      run: |
        semgrep \
          --config=auto \
          --json \
          --output=semgrep-report.json \
          src/ || true
        semgrep --config=auto src/ || true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Archive security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          semgrep-report.json
          trivy-results.sarif
        retention-days: 90

  code-duplication:
    name: Code Duplication Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install CPD
      run: |
        wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip
        unzip -q pmd-bin-6.55.0.zip

    - name: Run CPD (Copy/Paste Detection)
      run: |
        ./pmd-bin-6.55.0/bin/run.sh cpd \
          --language python \
          --minimum-tokens 50 \
          --format xml \
          --files src/ > cpd-report.xml

    - name: Archive CPD report
      uses: actions/upload-artifact@v3
      with:
        name: cpd-report
        path: cpd-report.xml

  complexity-analysis:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install radon xenon mccabe
        pip install -e .

    - name: Run Radon (complexity analysis)
      run: |
        # Cyclomatic complexity
        radon cc src/ -a -nc
        radon cc src/ --json > complexity-report.json
        
        # Maintainability index
        radon mi src/ --json > maintainability-report.json
        
        # Raw metrics
        radon raw src/ --json > raw-metrics.json

    - name: Run Xenon (complexity threshold)
      run: |
        xenon src/ --max-absolute B --max-modules B --max-average A || true

    - name: Archive complexity reports
      uses: actions/upload-artifact@v3
      with:
        name: complexity-reports
        path: |
          complexity-report.json
          maintainability-report.json
          raw-metrics.json

  license-check:
    name: License Compatibility Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install pip-audit and license tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-licenses pipdeptree
        pip install -r file_processing_requirements.txt

    - name: Check license compatibility
      run: |
        pip-licenses --format=json --output-file=licenses.json
        pipdeptree --json > dependency-tree.json
        
        # Check for incompatible licenses
        python -c "
        import json
        with open('licenses.json') as f:
            licenses = json.load(f)
        
        incompatible = []
        allowed = ['MIT', 'Apache-2.0', 'BSD-3-Clause', 'BSD-2-Clause', 'ISC', 'Python-2.0']
        
        for pkg in licenses:
            lic = pkg['License']
            if lic and not any(a in lic for a in allowed):
                incompatible.append(f'{pkg[\"Name\"]}: {lic}')
        
        if incompatible:
            print('Incompatible licenses found:')
            for item in incompatible:
                print(f'  - {item}')
            exit(1)
        else:
            print('All licenses are compatible')
        "

    - name: Archive license reports
      uses: actions/upload-artifact@v3
      with:
        name: license-reports
        path: |
          licenses.json
          dependency-tree.json

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [linting, type-checking, security-scan, complexity-analysis]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Quality Gate Evaluation
      run: |
        echo "Evaluating quality gates..."
        
        # Evaluar resultados de linting
        echo "Linting checks completed"
        
        # Evaluar resultados de seguridad
        echo "Security scanning completed"
        
        # Evaluar complejidad
        echo "Complexity analysis completed"
        
        echo "Quality gate evaluation completed"
