                }
            }
        }
        
        with open('docs_index.json', 'w') as f:
            json.dump(docs_index, f, indent=2)
        
        print("Documentation index generated")
        EOF
        
        python deploy_docs_api.py

    - name: Notify deployment
      if: secrets.SLACK_WEBHOOK_URL != ''
      run: |
        cat > notify_slack.py << 'EOF'
        import requests
        import json
        
        webhook_url = '${{ secrets.SLACK_WEBHOOK_URL }}'
        
        message = {
            'text': '📚 Documentation Deployed',
            'blocks': [
                {
                    'type': 'section',
                    'text': {
                        'type': 'mrkdwn',
                        'text': '*📚 Documentation Deployed Successfully*'
                    }
                },
                {
                    'type': 'section',
                    'fields': [
                        {
                            'type': 'mrkdwn',
                            'text': '*Branch:*\n${{ github.ref_name }}'
                        },
                        {
                            'type': 'mrkdwn',
                            'text': '*Commit:*\n`${{ github.sha[:8] }}`'
                        },
                        {
                            'type': 'mrkdwn',
                            'text': '*URL:*\n<https://your-org.github.io/mcp-core-superior/|View Docs>'
                        }
                    ]
                }
            ]
        }
        
        response = requests.post(webhook_url, json=message)
        if response.status_code == 200:
            print('✅ Slack notification sent')
        else:
            print(f'⚠️ Slack notification failed: {response.status_code}')
        EOF
        
        python notify_slack.py

    - name: Archive deployment info
      uses: actions/upload-artifact@v3
      with:
        name: documentation-deployment
        path: |
          docs_index.json
        retention-days: 90
