[tool:pytest]
minversion = 6.0
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=90
    --cov-branch
    --tb=short
    --disable-warnings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    network: Tests that require network access
    auth: Tests that require authentication
    graph_api: Tests that require Microsoft Graph API
    rate_limiting: Tests for rate limiting functionality
    retry: Tests for retry mechanisms
    mock: Tests using mocked dependencies
    word: Tests for Word agent
    excel: Tests for Excel agent
    powerpoint: Tests for PowerPoint agent
    outlook: Tests for Outlook agent
    onedrive: Tests for OneDrive agent
    teams: Tests for Teams agent
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning