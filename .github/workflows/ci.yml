name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,reasoning,research,market]"

      - name: Lint (ruff)
        run: |
          ruff check backend/app/security backend/app/swarm backend/app/logic_engine \
                     backend/app/evolution backend/app/orchestrator backend/app/organism \
                     backend/app/tools \
                     backend/app/core/cli_adapters.py backend/app/core/providers.py \
                     backend/app/core/onboarding.py backend/app/core/env_loader.py \
                     backend/app/core/console.py \
                     backend/app/services/silhouette_brain_service.py conectar.py tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Subir cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Barrera de seguridad: impide que vuelvan a entrar los problemas que la
  # auditoría encontró. Falla el build si reaparecen.
  guardrails:
    name: Barreras de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ningún secreto versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(production|staging|development|silhouettemcp)$|master\.key$|\.pem$|\.p12$'; then
            echo "::error::Hay archivos de secretos en el control de versiones."
            exit 1
          fi
          echo "OK: no hay secretos versionados."

      - name: Ninguna clave de API en el árbol
        run: |
          # Se excluyen plantillas (.example/.template), que contienen marcadores.
          if git grep -nE 'sk-(or-)?v?1?-[A-Za-z0-9_-]{20,}' \
               -- ':!*.md' ':!tests/*' ':!*.example' ':!*.template'; then
            echo "::error::Se detectó lo que parece una clave de API real."
            exit 1
          fi
          echo "OK: no se detectaron claves."

      - name: Ninguna credencial escrita en el código
        run: |
          if git grep -nE 'password_hash.*hashlib\.(sha256|md5)\(".+"\)' -- '*.py'; then
            echo "::error::Hay una contraseña en claro dentro del código."
            exit 1
          fi
          echo "OK: no hay credenciales embebidas."

      # Alcance: las superficies que se ejecutan. El codigo heredado vive en
      # `legacy/`, no se sirve, y tiene su propia barrera de aislamiento.
      - name: CORS sin comodín junto a credenciales
        run: |
          if git grep -nE 'allow_origins\s*=\s*\[\s*"\*"\s*\]' \
               -- 'silhouettemcp_server.py' 'backend/app/**/*.py' 'backend/main.py'; then
            echo "::error::CORS con comodín en una superficie activa. Use una lista blanca."
            exit 1
          fi
          echo "OK: CORS restringido en las superficies activas."

      - name: Ningún .pyc versionado
        run: |
          if git ls-files | grep -E '__pycache__|\.pyc$'; then
            echo "::error::Hay archivos compilados en el control de versiones."
            exit 1
          fi
          echo "OK: sin artefactos compilados."

      # Impide que vuelva la clase de defecto más dañina del proyecto: declarar
      # éxito cuando una capacidad no está disponible.
      - name: Ninguna respuesta fabricada en la ruta activa
        run: |
          if git grep -nE '"(success|searched)":\s*True' \
               -- 'backend/app/agents/executor.py' 'backend/app/core/llm_router.py' \
             | grep -iE 'mock|simulad|fallback'; then
            echo "::error::Se detectó una respuesta fabricada en un camino de fallo."
            exit 1
          fi
          echo "OK: los fallos no se disfrazan de éxito."

      # La superficie activa es todo el repositorio menos `legacy/` (archivo
      # histórico, no ejecutable) y los tests, donde simular una dependencia es
      # ingeniería correcta.
      - name: Ninguna simulación en la superficie activa
        run: |
          if git grep -nE '\b(mock_data|fake_data|dummy_data|_simulate_|MockFastMCP)|random\.(uniform|randint|choice)\s*\(' \
               -- '*.py' ':!legacy/**' ':!tests/**' ':!mcp-context-forge/**' \
             | grep -vE ':\s*#|"""'; then
            echo "::error::Reapareció una simulación en la superficie activa."
            exit 1
          fi
          echo "OK: sin simulaciones fuera de legacy/ y tests."

      # Las barreras anteriores buscaban `mock_`/`random.`, y por eso no vieron
      # unas métricas de salud con cifras escritas a mano (1247 consultas, 2.1%
      # de error, 45.6 MB) que reportaban «healthy» pasara lo que pasara.
      - name: Los chequeos de salud no traen cifras fijas
        run: |
          # Un valor fabricado nunca es 0: los ceros son respuestas de error
          # legitimas. Se buscan cifras distintas de cero, fuera de comentarios.
          if grep -nE '(total_requests|total_queries|total_keys|memory_usage_mb|ops_per_second|error_rate_percent|cache_hit_ratio)\s*=\s*[1-9]' \
               backend/app/api/health.py | grep -vE ':\s*#|Antes devolvia'; then
            echo "::error::Un chequeo de salud vuelve a devolver métricas fijas."
            exit 1
          fi
          if grep -nE 'Simular (ping|latencia)|# Por ahora simular' backend/app/api/health.py; then
            echo "::error::Un chequeo de salud simula la comprobación en lugar de hacerla."
            exit 1
          fi
          echo "OK: los chequeos de salud miden de verdad."

      # Una auditoria comparo lo que un agente describia con lo que el codigo
      # hacia: la coherencia entre CLIs concurrentes se daba por implementada y
      # no existia. Estas comprobaciones impiden que vuelva a ser solo una
      # descripcion.
      - name: La coherencia entre agentes esta implementada
        run: |
          for f in session.py agent_models.py cli_manager.py; do
            if [ ! -f "backend/app/core/$f" ]; then
              echo "::error::Falta backend/app/core/$f"
              exit 1
            fi
          done
          if ! grep -q "session_id" backend/app/core/session.py; then
            echo "::error::Las sesiones deben tener identificador compartido."
            exit 1
          fi
          if ! grep -q "compose_prompt" backend/app/core/session.py; then
            echo "::error::El prompt debe componerse con el contexto compartido."
            exit 1
          fi
          if ! grep -q "worktree" backend/app/projects/workspaces.py; then
            echo "::error::El aislamiento por worktree debe estar implementado."
            exit 1
          fi
          echo "OK: sesion compartida, contexto inyectado y aislamiento reales."

      # Reimportar los módulos archivados reintroduce sus datos inventados.
      - name: Nada importa desde legacy/
        run: |
          if git grep -nE '^\s*(from|import)\s+legacy|from\s+legacy\.' \
               -- '*.py' ':!legacy/**'; then
            echo "::error::La superficie activa importa código archivado."
            exit 1
          fi
          echo "OK: legacy/ está aislado."

      # El fallback devolvía saludos y listas de capacidades elegidos por
      # palabras clave del prompt cuando no había ningún modelo. Quien
      # preguntaba recibía una respuesta segura de sí misma en lugar de saber
      # que el sistema no tenía con qué responder.
      - name: El router no inventa respuestas cuando no hay modelo
        run: |
          if grep -nE 'prompt_lower|Capacidades del Sistema|He analizado tu solicitud' \
               backend/app/core/llm_router.py; then
            echo "::error::El router volvió a fabricar respuestas en el fallback."
            exit 1
          fi
          if ! grep -q 'raise NoProviderAvailable' backend/app/core/llm_router.py; then
            echo "::error::El fallback debe lanzar NoProviderAvailable, no devolver texto."
            exit 1
          fi
          echo "OK: sin modelo, el router falla en lugar de inventar."

      # Los agentes devolvían el texto del error como si fuera la respuesta del
      # modelo, y el orquestador lo reportaba como síntesis correcta.
      - name: Los agentes no devuelven errores como respuesta
        run: |
          if grep -nE '100% activo y verificado|\[Error LLM - Fallback' \
               -- backend/app/agents/*.py | grep -vE '^\S+:[0-9]+:\s*#'; then
            echo "::error::Un agente vuelve a devolver texto fabricado ante un fallo."
            exit 1
          fi
          echo "OK: los agentes propagan los fallos."

      # Las claves se leían con os.getenv() en el cuerpo de la clase, lo que las
      # congelaba vacías si el .env se cargaba después.
      - name: Las claves de API no se congelan al importar
        run: |
          if grep -nE '^\s+(MINIMAX|OPENROUTER)_API_KEY:\s*str\s*=\s*os\.getenv' \
               backend/app/core/config.py; then
            echo "::error::Las claves vuelven a leerse en el cuerpo de la clase."
            exit 1
          fi
          echo "OK: las claves reflejan el entorno actual."

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: mcp-dashboard/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm build
