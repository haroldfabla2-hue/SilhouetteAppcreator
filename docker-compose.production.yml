version: '3.8'

services:
  iris-server:
    build: .
    container_name: iris-metrics-server
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - IRIS_ENV=production
      - IRIS_LOG_LEVEL=INFO
      - IRIS_DOMAIN=silhouettemcp.albertofarah.com
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - iris-network

  nginx:
    image: nginx:alpine
    container_name: iris-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontends:/var/www/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - iris-server
    restart: unless-stopped
    networks:
      - iris-network

  # Servicio de backup automático
  iris-backup:
    image: alpine:latest
    container_name: iris-backup
    volumes:
      - ./data:/backup/data:ro
      - ./backups:/backup
    command: |
      sh -c "
        while true; do
          timestamp=$$(date +%Y%m%d_%H%M%S)
          tar -czf /backup/iris_backup_$$timestamp.tar.gz /backup/data
          # Mantener solo los últimos 30 backups
          ls -t /backup/iris_backup_*.tar.gz | tail -n +31 | xargs rm -f 2>/dev/null || true
          sleep 86400  # 24 horas
        done
      "
    restart: unless-stopped
    networks:
      - iris-network

  # Monitor de salud del sistema
  iris-monitor:
    image: alpine:latest
    container_name: iris-monitor
    volumes:
      - ./monitoring:/monitoring
    command: |
      sh -c "
        while true; do
          # Verificar estado del servidor
          if ! curl -f -s http://iris-server:8000/health > /dev/null; then
            echo '$(date): IRIS Server down, restarting...' >> /monitoring/monitor.log
            docker-compose restart iris-server
          fi
          
          # Verificar uso de disco
          DISK_USAGE=$$(df / | tail -1 | awk '{print $$5}' | sed 's/%//')
          if [ $$DISK_USAGE -gt 85 ]; then
            echo '$(date): Disk usage high: $$DISK_USAGE%' >> /monitoring/monitor.log
            # Limpiar logs antiguos
            find /monitoring -name '*.log' -mtime +7 -delete
          fi
          
          sleep 300  # Verificar cada 5 minutos
        done
      "
    restart: unless-stopped
    networks:
      - iris-network

volumes:
  iris_data:
    driver: local
  iris_logs:
    driver: local

networks:
  iris-network:
    driver: bridge
    name: iris-network