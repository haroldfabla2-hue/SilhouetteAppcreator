events {
    worker_connections 1024;
}

http {
    upstream iris_backend {
        server iris-server:8000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=stream:10m rate=5r/s;

    server {
        listen 80;
        server_name tu-dominio.com;  # Cambiar por tu dominio

        # Redirección HTTP a HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name tu-dominio.com;  # Cambiar por tu dominio

        # Configuración SSL (opcional)
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://iris_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Streaming SSE
        location /api/stream {
            limit_req zone=stream burst=10 nodelay;
            proxy_pass http://iris_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers específicos para SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            
            # Timeouts más largos para streaming
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Frontend estático
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Cache estático
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            proxy_pass http://iris_backend/health;
            access_log off;
        }

        # Logs de acceso
        access_log /var/log/nginx/iris_access.log;
        error_log /var/log/nginx/iris_error.log;
    }

    # Configuración de seguridad
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}