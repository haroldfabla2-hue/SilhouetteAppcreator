events {
    worker_connections 1024;
}

http {
    # Configuración básica
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    # Upstream para el backend IRIS
    upstream iris_backend {
        server iris-server:8000;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=stream:10m rate=5r/s;

    # Configuración principal para silhouettemcp.albertofarah.com
    server {
        listen 80;
        server_name silhouettemcp.albertofarah.com www.silhouettemcp.albertofarah.com;

        # Redirección HTTP a HTTPS (se habilitará después de configurar SSL)
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name silhouettemcp.albertofarah.com www.silhouettemcp.albertofarah.com;

        # Configuración SSL (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/silhouettemcp.albertofarah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/silhouettemcp.albertofarah.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API endpoints con rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://iris_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Streaming SSE (Server-Sent Events)
        location /api/stream {
            limit_req zone=stream burst=10 nodelay;
            proxy_pass http://iris_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers específicos para SSE
            proxy_buffering off;
            proxy_cache off;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            
            # Timeouts específicos para streaming
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Headers para SSE
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        # Dashboard principal
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Cache para recursos estáticos
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }

        # Health check público
        location /health {
            proxy_pass http://iris_backend/health;
            access_log off;
            proxy_set_header Host $host;
        }

        # API documentation
        location /docs {
            proxy_pass http://iris_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Logs
        access_log /var/log/nginx/iris_access.log;
        error_log /var/log/nginx/iris_error.log;

        # Configuración adicional
        client_max_body_size 50M;
        client_body_timeout 30s;
        client_header_timeout 30s;
    }

    # Configuración para subdominios futuros (ej: api.silhouettemcp.albertofarah.com)
    server {
        listen 443 ssl http2;
        server_name api.silhouettemcp.albertofarah.com;

        ssl_certificate /etc/letsencrypt/live/silhouettemcp.albertofarah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/silhouettemcp.albertofarah.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://iris_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Configuración de seguridad
    server_tokens off;
    
    # Bloquear acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }
    
    location ~ \.(env|log|conf)$ {
        deny all;
    }
}