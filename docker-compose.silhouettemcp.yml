version: '3.8'

services:
  # Servidor SilhouetteMCP
  silhouettemcp-server:
    build:
      context: .
      dockerfile: Dockerfile.silhouettemcp
    container_name: silhouettemcp_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./silhouettemcp_data.json:/app/silhouettemcp_data.json
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - silhouettemcp_network

  # Nginx Reverse Proxy con SSL
  nginx:
    image: nginx:alpine
    container_name: silhouettemcp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.silhouettemcp.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - silhouettemcp-server
    networks:
      - silhouettemcp_network

  # Certbot para SSL automático
  certbot:
    image: certbot/certbot:latest
    container_name: silhouettemcp_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email alberto.farahb@hotmail.com --agree-tos --no-eff-email -d silhouettemcp.albertofarah.com
    restart: "no"

networks:
  silhouettemcp_network:
    driver: bridge

volumes:
  letsencrypt:
  www_certbot: